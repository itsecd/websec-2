<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода в городах | Лабораторная работа №2</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-titles">
            <h1>МетеоРадар</h1>
            <p>Прогноз погоды в городах России / by Шестериков Борис</p>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Найти город...">
            <button id="searchBtn">Искать</button>
        </div>
    </header>

    <main class="main-content">
        <div id="map" class="map-container"></div>
        
        <div id="infoPanel" class="info-panel">
            
            <div id="emptyState" class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p>Выберите город на карте или воспользуйтесь поиском</p>
            </div>

            <div id="loader" class="loader-container hidden">
                <div class="spinner"></div>
                <p>Получение данных...</p>
            </div>

            <div id="weatherContent" class="weather-content hidden fade-in">
                <h2 id="cityName" class="city-name">Название города</h2>
                <p id="cityCoords" class="city-coords">Широта: 0, Долгота: 0</p>
                
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Температура</span>
                        <span id="currentTemp" class="metric-value">-- °C</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Ветер</span>
                        <span id="currentWind" class="metric-value">-- м/с</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Осадки</span>
                        <span id="currentPrecip" class="metric-value">-- мм</span>
                    </div>
                </div>

                <div class="chart-section">
                    <h3>Прогноз температуры (7 дней)</h3>
                    <div class="chart-container">
                        <canvas id="tempChart"></canvas>
                    </div>
                </div>

                <div class="chart-section">
                    <h3>Ветер и Осадки</h3>
                    <div class="chart-container">
                        <canvas id="mixedChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
