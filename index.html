<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта погоды</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #controls { padding: 12px; background: #ffffff; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 10px; }
        #search { width: 350px; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        #map { flex-grow: 1; z-index: 1; }
        .chart-container { width: 450px; height: 250px; position: relative; }
        .leaflet-popup-content { width: auto !important; }
    </style>
</head>
<body>
    <div id="controls">
        <input type="text" id="search" list="city-list" placeholder="Введите название населенного пункта...">
        <datalist id="city-list"></datalist>
    </div>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
