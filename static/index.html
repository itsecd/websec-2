<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Расписание | Лабораторная работа</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="container">
                <div class="header__inner">
                    <div class="logo">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                        <span>Расписание</span>
                    </div>
                    <div class="header__info">
                        <span id="currentWeekBadge"></span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="container">
                <div class="view-switch">
                    <button id="btnGroups" class="view-switch__btn active">Группы</button>
                    <button id="btnTeachers" class="view-switch__btn">Преподаватели</button>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label class="control-label">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <span id="selectLabel">Группа</span>
                        </label>
                        <div class="select-wrapper">
                            <select id="entitySelect" class="control-select">
                                <option value="">Загрузка...</option>
                            </select>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            Неделя
                        </label>
                        <div class="week-control">
                            <button class="week-nav" id="weekPrev">◀</button>
                            <input type="number" id="weekInput" class="week-input" min="1" max="52" value="1">
                            <button class="week-nav" id="weekNext">▶</button>
                        </div>
                    </div>
                </div>

                <div class="legend">
                    <div class="legend__title">Условные обозначения:</div>
                    <div class="legend__items">
                        <div class="legend__item">
                            <div class="legend__color legend__color--lecture"></div>
                            <span>Лекция</span>
                        </div>
                        <div class="legend__item">
                            <div class="legend__color legend__color--practice"></div>
                            <span>Практика</span>
                        </div>
                        <div class="legend__item">
                            <div class="legend__color legend__color--lab"></div>
                            <span>Лабораторная</span>
                        </div>
                        <div class="legend__item">
                            <div class="legend__color legend__color--exam"></div>
                            <span>Экзамен</span>
                        </div>
                        <div class="legend__item">
                            <div class="legend__color legend__color--credit"></div>
                            <span>Зачёт</span>
                        </div>
                        <div class="legend__item">
                            <div class="legend__color legend__color--default"></div>
                            <span>Другое</span>
                        </div>
                    </div>
                </div>

                <div id="loadingIndicator" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <span>Загрузка расписания...</span>
                </div>

                <div class="schedule-container">
                    <div class="table-wrapper">
                        <table class="schedule-table">
                            <thead>
                                <tr>
                                    <th>Время</th>
                                    <th>Понедельник</th>
                                    <th>Вторник</th>
                                    <th>Среда</th>
                                    <th>Четверг</th>
                                    <th>Пятница</th>
                                    <th>Суббота</th>
                                </tr>
                            </thead>
                            <tbody id="scheduleBody">
                                <tr>
                                    <td colspan="7" class="empty-state">Выберите группу или преподавателя</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p>2026 Расписание Самарский университет | Данные обновляются автоматически</p>
            </div>
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
