<!DOCTYPE html>
<html lang="ru">

<link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание СГАУ - Самарский университет</title>
    <link rel="stylesheet" href="/css/style.css">
</link>

<body>
    <div class="header">
        <h1>Расписание СГАУ</h1>
        <p>Самарский университет</p>
    </div>

    <div class="main">
        <div class="mode-switch">
            <button class="mode-btn active" data-mode="group">По группе</button>
            <button class="mode-btn" data-mode="teacher">По преподавателю</button>
        </div>

        <div id="groupMode">
            <select id="groupSelect">
                <option value="">Загрузка групп...</option>
            </select>
        </div>

        <div id="teacherMode" class="hidden">
            <input type="text" id="teacherInput" placeholder="Введите фамилию преподавателя">
            <select id="teacherSelect" class="hidden"></select>
        </div>

        <div class="week-controls">
            <button id="prevWeek">← Предыдущая</button>
            <span id="weekNumber">- неделя</span>
            <button id="nextWeek">Следующая →</button>
            <button id="currentWeekBtn">Текущая</button>
        </div>

        <div id="loader" class="loader hidden">Загрузка...</div>
        <div id="error" class="error hidden"></div>
        <div id="schedule"></div>
    </div>

    <div class="footer">
        <p>© 2025 Самарский университет | Данные с ssau.ru</p>
    </div>

    <script src="/js/app.js"></script>
</body>

</html>
