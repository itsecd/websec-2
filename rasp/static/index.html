<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Расписание</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&subset=cyrillic" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="container">
                <div class="header__inner">
                    <div class="header__left">
                        <h1 class="header__title">Расписание</h1>
                    </div>
                    <div class="header__right">
                        <div class="header__date" id="current-date"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="container">
                <div class="mode-switch">
                    <button class="mode-btn mode-btn--active" data-mode="group">По группе</button>
                    <button class="mode-btn" data-mode="teacher">По преподавателю</button>
                </div>

                <div id="group-mode" class="search-panel">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Институт / Факультет</label>
                            <select id="institute-select" class="form-control">
                                <option value="">Загрузка...</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Курс</label>
                            <select id="course-select" class="form-control" disabled>
                                <option value="">Сначала выберите институт</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Группа</label>
                            <select id="group-select" class="form-control" disabled>
                                <option value="">Сначала выберите курс</option>
                            </select>
                        </div>
                        
                        <div class="form-group form-group--button">
                            <button id="show-group-btn" class="btn btn--primary" disabled>Показать</button>
                        </div>
                    </div>
                </div>

                <div id="teacher-mode" class="search-panel" style="display: none;">
                    <div class="form-row">
                        <div class="form-group form-group--search">
                            <label class="form-label">Преподаватель</label>
                            <div class="search-wrapper">
                                <input type="text" id="teacher-input" class="form-control" placeholder="Введите фамилию преподавателя" autocomplete="off">
                                <div id="teacher-suggestions" class="suggestions-dropdown" style="display: none;"></div>
                            </div>
                        </div>
                        <div class="form-group form-group--button">
                            <button id="show-teacher-btn" class="btn btn--primary" disabled>Показать</button>
                        </div>
                    </div>
                </div>

                <div id="week-navigation" class="week-nav" style="display: none;">
                    <button id="prev-week-btn" class="week-nav__btn" disabled>← Предыдущая</button>
                    <span id="week-info" class="week-nav__info">—</span>
                    <button id="next-week-btn" class="week-nav__btn" disabled>Следующая →</button>
                    <select id="week-select" class="week-nav__select" style="display: none;"></select>
                </div>

                <div id="status" class="status status--idle">Выберите группу или преподавателя</div>
                <div id="schedule-container" class="schedule-container"></div>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
